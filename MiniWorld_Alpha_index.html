<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>MiniWorld Alpha</title>
<style>
*{box-sizing:border-box;touch-action:none}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;font-family:Arial,sans-serif}
#game{position:fixed;inset:0;width:100vw;height:100vh;display:block;background:#6ec7ef}
#hud{position:fixed;top:12px;left:12px;z-index:5;background:#24323fe8;color:#fff;border-radius:14px;padding:8px 12px;font-size:14px}
#hint{position:fixed;top:12px;right:12px;z-index:5;background:#24323fe8;color:#fff;border-radius:14px;padding:8px 11px;font-size:11px;text-align:right}
#controls{position:fixed;left:14px;right:14px;bottom:14px;z-index:10;display:flex;justify-content:space-between;align-items:flex-end;pointer-events:none}
.group{display:flex;gap:8px;pointer-events:auto}
button{width:62px;height:62px;border:0;border-radius:18px;background:#1f2d3bee;color:#fff;font-size:25px;font-weight:bold}
#jump{width:72px;height:72px;border-radius:50%;font-size:28px}
#hotbar{
 position:fixed;left:50%;transform:translateX(-50%);bottom:12px;z-index:9;
 display:grid;grid-template-columns:repeat(7,54px);gap:7px;background:#1c2631ee;padding:9px 11px;border-radius:18px;
 box-shadow:0 4px 14px #0006
}
.slot{
 position:relative;width:54px;height:54px;border:2px solid #ffffff33;border-radius:12px;
 background:#0f151ddd;display:flex;align-items:center;justify-content:center;font-size:26px;color:#fff;user-select:none
}
.slot.selected{border-color:#fff;box-shadow:0 0 0 2px #ffffff33 inset}
.count{position:absolute;right:5px;bottom:3px;font-size:12px;font-weight:bold;text-shadow:0 1px 2px #000}
#drawer{
 position:fixed;left:50%;transform:translateX(-50%);bottom:-240px;z-index:8;width:min(92vw,640px);
 background:#151e27f5;border-radius:20px 20px 0 0;padding:14px 14px 24px;transition:bottom .22s ease;
 box-shadow:0 -5px 18px #0007;color:#fff
}
#drawer.open{bottom:0}
#drawerTitle{text-align:center;font-weight:bold;margin-bottom:10px}
#drawerSlots{display:grid;grid-template-columns:repeat(7,1fr);gap:8px}
.drawerSlot{
 min-height:64px;border:2px solid #ffffff22;border-radius:12px;background:#0f151ddd;
 display:flex;align-items:center;justify-content:center;font-size:27px;position:relative
}
.drawerSlot.selected{border-color:#fff}
.drawerCount{position:absolute;right:6px;bottom:4px;font-size:12px}
#swipeHandle{
 position:fixed;left:50%;transform:translateX(-50%);bottom:76px;z-index:11;
 width:110px;height:24px;border-radius:12px 12px 0 0;background:#1c2631ee;color:#fff;
 display:flex;align-items:center;justify-content:center;font-size:12px
}
#breakRing{
 position:fixed;width:46px;height:46px;border-radius:50%;border:4px solid #fff8;display:none;z-index:20;pointer-events:none
}
#breakRing.show{display:block}
#rotate{position:fixed;inset:0;background:#111;color:#fff;z-index:50;display:none;align-items:center;justify-content:center;text-align:center;font-size:22px}
@media (orientation:portrait){#rotate{display:flex}}
</style>
</head>
<body>
<canvas id="game" width="1000" height="500"></canvas>

<div id="hud">🪙 <span id="coin">0</span></div>
<div id="hint">HOLD block = BREAK<br>TOUCH kosong = PLACE<br>Mode: <span id="modeName">PUNCH</span></div>

<div id="controls">
  <div class="group">
    <button id="left">◀</button>
    <button id="right">▶</button>
  </div>
  <div class="group">
    <button id="jump">▲</button>
  </div>
</div>

<div id="swipeHandle">▲ BACKPACK</div>

<div id="hotbar">
  <div class="slot selected" data-type="tool" data-item="punch">👊</div>
  <div class="slot" data-type="tool" data-item="wrench">🔧</div>
  <div class="slot" data-type="block" data-item="grass">🟩<span class="count" id="cnt-grass">8</span></div>
  <div class="slot" data-type="block" data-item="dirt">🟫<span class="count" id="cnt-dirt">8</span></div>
  <div class="slot" data-type="block" data-item="stone">🪨<span class="count" id="cnt-stone">3</span></div>
  <div class="slot" data-type="block" data-item="wood">🪵<span class="count" id="cnt-wood">4</span></div>
  <div class="slot" data-type="block" data-item="leaf">🌿<span class="count" id="cnt-leaf">4</span></div>
</div>

<div id="drawer">
  <div id="drawerTitle">BACKPACK — swipe down untuk tutup</div>
  <div id="drawerSlots">
    <div class="drawerSlot selected" data-type="tool" data-item="punch">👊</div>
    <div class="drawerSlot" data-type="tool" data-item="wrench">🔧</div>
    <div class="drawerSlot" data-type="block" data-item="grass">🟩<span class="drawerCount" id="dc-grass">8</span></div>
    <div class="drawerSlot" data-type="block" data-item="dirt">🟫<span class="drawerCount" id="dc-dirt">8</span></div>
    <div class="drawerSlot" data-type="block" data-item="stone">🪨<span class="drawerCount" id="dc-stone">3</span></div>
    <div class="drawerSlot" data-type="block" data-item="wood">🪵<span class="drawerCount" id="dc-wood">4</span></div>
    <div class="drawerSlot" data-type="block" data-item="leaf">🌿<span class="drawerCount" id="dc-leaf">4</span></div>
  </div>
</div>

<div id="breakRing"></div>
<div id="rotate">📱↔️<br><br>Putar HP ke horizontal</div>

<script>
(()=>{
const c=document.getElementById('game'),ctx=c.getContext('2d');
const CW=1000,CH=500,T=40,WORLD=80,GROUND=335;
let cam=0,score=0,selected='punch',selectedType='tool';
let blocks=[],coins=[];
const inventory={grass:8,dirt:8,stone:3,wood:4,leaf:4};
const p={x:120,y:GROUND-48,w:32,h:48,vx:0,vy:0,on:true,dir:1};
const k={l:false,r:false,j:false};

function build(){
 blocks=[];coins=[];
 for(let i=0;i<WORLD;i++){
   blocks.push({x:i*T,y:GROUND,t:'grass'});
   blocks.push({x:i*T,y:GROUND+T,t:'dirt'});
   blocks.push({x:i*T,y:GROUND+2*T,t:'dirt'});
   blocks.push({x:i*T,y:GROUND+3*T,t:'dirt'});
 }
 for(let i=8;i<=12;i++)blocks.push({x:i*T,y:GROUND-T,t:'grass'});
 for(let i=19;i<=23;i++)blocks.push({x:i*T,y:GROUND-2*T,t:'grass'});
 blocks.push({x:38*T,y:GROUND-T,t:'stone'});
 blocks.push({x:39*T,y:GROUND-T,t:'stone'});
 blocks.push({x:44*T,y:GROUND-T,t:'wood'});
 blocks.push({x:44*T,y:GROUND-2*T,t:'wood'});
 blocks.push({x:43*T,y:GROUND-3*T,t:'leaf'});
 blocks.push({x:44*T,y:GROUND-3*T,t:'leaf'});
 blocks.push({x:45*T,y:GROUND-3*T,t:'leaf'});
 coins=[{x:10*T,y:GROUND-T-20,got:false},{x:21*T,y:GROUND-2*T-20,got:false},{x:30*T,y:GROUND-20,got:false}];
}

function hit(b){return p.x<b.x+T&&p.x+p.w>b.x&&p.y<b.y+T&&p.y+p.h>b.y}
function update(){
 p.vx=(k.l?-4:0)+(k.r?4:0);if(p.vx)p.dir=p.vx<0?-1:1;
 if(k.j&&p.on){p.vy=-11;p.on=false;k.j=false}
 p.vy+=.55;
 p.x+=p.vx;
 for(const b of blocks)if(hit(b)){if(p.vx>0)p.x=b.x-p.w;else if(p.vx<0)p.x=b.x+T}
 p.y+=p.vy;p.on=false;
 for(const b of blocks)if(hit(b)){if(p.vy>0){p.y=b.y-p.h;p.vy=0;p.on=true}else if(p.vy<0){p.y=b.y+T;p.vy=0}}
 p.x=Math.max(0,Math.min(WORLD*T-p.w,p.x));
 cam=Math.max(0,Math.min(WORLD*T-CW,p.x-300));
 for(const q of coins)if(!q.got&&Math.abs(p.x+p.w/2-q.x)<28&&Math.abs(p.y+p.h/2-q.y)<34){
   q.got=true;score++;document.getElementById('coin').textContent=score;
 }
}

function drawBlock(b){
 const sx=b.x-cam,sy=b.y;
 if(b.t==='grass'){
  ctx.fillStyle='#8a582c';ctx.fillRect(sx,sy,T,T);ctx.fillStyle='#3db84c';ctx.fillRect(sx,sy,T,10);
 }else if(b.t==='stone'){
  ctx.fillStyle='#777';ctx.fillRect(sx,sy,T,T);ctx.fillStyle='#999';ctx.fillRect(sx+8,sy+8,7,6);ctx.fillRect(sx+25,sy+23,5,5);
 }else if(b.t==='wood'){
  ctx.fillStyle='#8a5628';ctx.fillRect(sx,sy,T,T);ctx.fillStyle='#b97d3b';ctx.fillRect(sx+5,sy+5,T-10,T-10);
 }else if(b.t==='leaf'){
  ctx.fillStyle='#2c9d45';ctx.fillRect(sx,sy,T,T);ctx.fillStyle='#4fc35f';ctx.fillRect(sx+6,sy+6,10,8);
 }else{
  ctx.fillStyle='#8a582c';ctx.fillRect(sx,sy,T,T);ctx.fillStyle='#b87842';ctx.fillRect(sx+6,sy+8,6,4);ctx.fillRect(sx+24,sy+23,5,5);
 }
 ctx.strokeStyle='#0002';ctx.strokeRect(sx,sy,T,T);
}

function drawPlayer(){
 const sx=p.x-cam,sy=p.y;
 ctx.fillStyle='#0003';ctx.beginPath();ctx.ellipse(sx+16,sy+48,18,5,0,0,Math.PI*2);ctx.fill();
 ctx.fillStyle='#ffd1a0';ctx.fillRect(sx+6,sy+2,20,18);
 ctx.fillStyle='#4a2e1d';ctx.fillRect(sx+6,sy+2,20,6);
 ctx.fillStyle='#111';ctx.fillRect(sx+(p.dir>0?20:10),sy+10,3,3);
 ctx.fillStyle='#e74943';ctx.fillRect(sx+3,sy+20,26,16);
 ctx.fillStyle='#ffd1a0';ctx.fillRect(sx,sy+22,4,11);ctx.fillRect(sx+28,sy+22,4,11);
 ctx.fillStyle='#315aa8';ctx.fillRect(sx+6,sy+36,8,12);ctx.fillRect(sx+18,sy+36,8,12);
}

function draw(){
 ctx.clearRect(0,0,CW,CH);
 const g=ctx.createLinearGradient(0,0,0,CH);g.addColorStop(0,'#69c9f3');g.addColorStop(1,'#d8f5ff');
 ctx.fillStyle=g;ctx.fillRect(0,0,CW,CH);
 ctx.fillStyle='#ffffffaa';
 for(let a=-((cam*.12)%280);a<CW+160;a+=280){
  ctx.beginPath();ctx.arc(a+40,75,20,0,7);ctx.arc(a+68,67,27,0,7);ctx.arc(a+98,76,18,0,7);ctx.fill();
 }
 blocks.forEach(b=>{if(b.x-cam>-T&&b.x-cam<CW+T)drawBlock(b)});
 coins.forEach(q=>{if(!q.got){ctx.fillStyle='#ffd83d';ctx.beginPath();ctx.arc(q.x-cam,q.y,10,0,7);ctx.fill();ctx.strokeStyle='#947000';ctx.stroke()}});
 drawPlayer();
}

function loop(){update();draw();requestAnimationFrame(loop)}

function bind(id,key){
 const e=document.getElementById(id);
 e.addEventListener('pointerdown',a=>{a.preventDefault();k[key]=true});
 ['pointerup','pointercancel','pointerleave'].forEach(ev=>e.addEventListener(ev,a=>{a.preventDefault();k[key]=false}));
}
bind('left','l');bind('right','r');bind('jump','j');

function blockAt(tx,ty){return blocks.find(b=>Math.floor(b.x/T)===tx&&Math.floor(b.y/T)===ty)}
function near(tx,ty){
 const cx=tx*T+T/2,cy=ty*T+T/2;
 return Math.hypot((p.x+p.w/2)-cx,(p.y+p.h/2)-cy)<=T*3.1;
}
function overlapsPlayer(tx,ty){
 const bx=tx*T,by=ty*T;
 return p.x<bx+T&&p.x+p.w>bx&&p.y<by+T&&p.y+p.h>by;
}
function updateInventory(){
 Object.keys(inventory).forEach(n=>{
  const a=document.getElementById('cnt-'+n),b=document.getElementById('dc-'+n);
  if(a)a.textContent=inventory[n];
  if(b)b.textContent=inventory[n];
 });
}
function setSelected(type,item){
 selectedType=type;selected=item;
 document.querySelectorAll('.slot,.drawerSlot').forEach(s=>{
   s.classList.toggle('selected',s.dataset.type===type&&s.dataset.item===item);
 });
 document.getElementById('modeName').textContent=item==='punch'?'PUNCH':item==='wrench'?'WRENCH':item.toUpperCase();
}

document.querySelectorAll('.slot,.drawerSlot').forEach(slot=>{
 slot.addEventListener('pointerdown',e=>{
  e.preventDefault();e.stopPropagation();setSelected(slot.dataset.type,slot.dataset.item);
 });
});

let pressTimer=null,pressData=null;
const ring=document.getElementById('breakRing');

function canvasPoint(e){
 const r=c.getBoundingClientRect();
 const sx=(e.clientX-r.left)/r.width*CW;
 const sy=(e.clientY-r.top)/r.height*CH;
 return {sx,sy,tx:Math.floor((sx+cam)/T),ty:Math.floor(sy/T)};
}
function cancelHold(){
 clearTimeout(pressTimer);pressTimer=null;pressData=null;ring.classList.remove('show');
}
c.addEventListener('pointerdown',e=>{
 if(innerWidth<=innerHeight)return;
 const pt=canvasPoint(e);if(!near(pt.tx,pt.ty))return;
 const b=blockAt(pt.tx,pt.ty);

 if(selected==='wrench'){
   if(b){blocks.splice(blocks.indexOf(b),1);if(inventory[b.t]!==undefined)inventory[b.t]++;updateInventory();}
   return;
 }

 if(b){
   pressData={b,pt};
   ring.style.left=(e.clientX-23)+'px';ring.style.top=(e.clientY-23)+'px';ring.classList.add('show');
   pressTimer=setTimeout(()=>{
     if(pressData&&blocks.includes(pressData.b)){
       const bb=pressData.b;blocks.splice(blocks.indexOf(bb),1);
       if(inventory[bb.t]!==undefined)inventory[bb.t]++;
       updateInventory();
     }
     cancelHold();
   },450);
 }else if(selectedType==='block'){
   if(inventory[selected]<=0||overlapsPlayer(pt.tx,pt.ty))return;
   const neighbors=[blockAt(pt.tx+1,pt.ty),blockAt(pt.tx-1,pt.ty),blockAt(pt.tx,pt.ty+1),blockAt(pt.tx,pt.ty-1)].filter(Boolean);
   if(neighbors.length){blocks.push({x:pt.tx*T,y:pt.ty*T,t:selected});inventory[selected]--;updateInventory();}
 }
});
['pointerup','pointercancel','pointerleave'].forEach(ev=>c.addEventListener(ev,cancelHold));

const drawer=document.getElementById('drawer'),handle=document.getElementById('swipeHandle');
let swipeStartY=null;
handle.addEventListener('pointerdown',e=>{swipeStartY=e.clientY;handle.setPointerCapture(e.pointerId)});
handle.addEventListener('pointerup',e=>{
 if(swipeStartY!==null&&e.clientY<swipeStartY-20)drawer.classList.add('open');
 swipeStartY=null;
});
drawer.addEventListener('pointerdown',e=>{swipeStartY=e.clientY});
drawer.addEventListener('pointerup',e=>{
 if(swipeStartY!==null&&e.clientY>swipeStartY+25)drawer.classList.remove('open');
 swipeStartY=null;
});

build();updateInventory();setSelected('tool','punch');loop();
})();
</script>
</body>
</html>
