<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>MiniWorld Fixed Canvas v5</title>
<style>
*{box-sizing:border-box;touch-action:none}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;font-family:Arial,sans-serif}
#game{position:fixed;inset:0;width:100vw;height:100vh;display:block;background:#6ec7ef}
#hud,#hint{position:fixed;top:12px;z-index:5;background:#24323fe8;color:#fff;border-radius:14px;padding:8px 12px}
#hud{left:12px;font-size:14px}
#hint{right:12px;font-size:11px;text-align:right}
#controls{position:fixed;left:14px;right:14px;bottom:14px;z-index:10;display:flex;justify-content:space-between}
.group{display:flex;gap:8px}
button{width:58px;height:58px;border:0;border-radius:16px;background:#1f2d3bee;color:#fff;font-size:24px;font-weight:bold}
.action{width:72px;font-size:12px}
#rotate{position:fixed;inset:0;background:#111;color:#fff;z-index:50;display:none;align-items:center;justify-content:center;text-align:center;font-size:22px}
@media (orientation:portrait){#rotate{display:flex}}
</style>
</head>
<body>
<canvas id="game" width="1000" height="500"></canvas>
<div id="hud">🪙 <span id="coin">0</span> &nbsp; 🌱 <span id="seed">3</span></div>
<div id="hint">◀ ▶ jalan · ▲ lompat<br>BREAK = hancurkan · PLANT = tanam</div>
<div id="controls">
  <div class="group">
    <button id="left">◀</button><button id="right">▶</button><button id="jump">▲</button>
  </div>
  <div class="group">
    <button class="action" id="plant">PLANT</button><button class="action" id="brk">BREAK</button>
  </div>
</div>
<div id="rotate">📱↔️<br><br>Putar HP ke horizontal</div>

<script>
(()=>{
const c=document.getElementById('game'),ctx=c.getContext('2d');
const CW=1000,CH=500,T=40,WORLD=80,GROUND=335;
let cam=0,score=0,seeds=3,blocks=[],coins=[];
const p={x:120,y:GROUND-48,w:32,h:48,vx:0,vy:0,on:true,dir:1};
const k={l:false,r:false,j:false};

function build(){
 blocks=[];coins=[];
 for(let i=0;i<WORLD;i++){
   blocks.push({x:i*T,y:GROUND,t:'g'});
   blocks.push({x:i*T,y:GROUND+T,t:'d'});
   blocks.push({x:i*T,y:GROUND+2*T,t:'d'});
   blocks.push({x:i*T,y:GROUND+3*T,t:'d'});
 }
 for(let i=8;i<=12;i++)blocks.push({x:i*T,y:GROUND-T,t:'g'});
 for(let i=19;i<=23;i++)blocks.push({x:i*T,y:GROUND-2*T,t:'g'});
 for(let i=32;i<=35;i++)blocks.push({x:i*T,y:GROUND-T,t:'g'});
 coins=[
  {x:10*T,y:GROUND-T-20,got:false},
  {x:21*T,y:GROUND-2*T-20,got:false},
  {x:30*T,y:GROUND-20,got:false}
 ];
}
function hit(b){return p.x<b.x+T&&p.x+p.w>b.x&&p.y<b.y+T&&p.y+p.h>b.y}
function update(){
 p.vx=(k.l?-4:0)+(k.r?4:0);
 if(p.vx)p.dir=p.vx<0?-1:1;
 if(k.j&&p.on){p.vy=-11;p.on=false;k.j=false}
 p.vy+=.55;
 p.x+=p.vx;
 for(const b of blocks)if(hit(b)){if(p.vx>0)p.x=b.x-p.w;else if(p.vx<0)p.x=b.x+T}
 p.y+=p.vy;p.on=false;
 for(const b of blocks)if(hit(b)){
   if(p.vy>0){p.y=b.y-p.h;p.vy=0;p.on=true}
   else if(p.vy<0){p.y=b.y+T;p.vy=0}
 }
 p.x=Math.max(0,Math.min(WORLD*T-p.w,p.x));
 cam=Math.max(0,Math.min(WORLD*T-CW,p.x-300));
 for(const q of coins)if(!q.got&&Math.abs(p.x+p.w/2-q.x)<28&&Math.abs(p.y+p.h/2-q.y)<34){
   q.got=true;score++;document.getElementById('coin').textContent=score;
 }
}
function drawBlock(b){
 const sx=b.x-cam,sy=b.y;
 if(b.t==='g'){
   ctx.fillStyle='#8a582c';ctx.fillRect(sx,sy,T,T);
   ctx.fillStyle='#3db84c';ctx.fillRect(sx,sy,T,10);
   ctx.fillStyle='#70d965';ctx.fillRect(sx+5,sy+2,9,4);
 } else if(b.t==='tree'){
   ctx.fillStyle='#74431f';ctx.fillRect(sx+13,sy+14,14,26);
   ctx.fillStyle='#2c9d45';ctx.beginPath();ctx.arc(sx+20,sy+10,19,0,Math.PI*2);ctx.fill();
 } else {
   ctx.fillStyle='#8a582c';ctx.fillRect(sx,sy,T,T);
   ctx.fillStyle='#b87842';ctx.fillRect(sx+6,sy+8,6,4);ctx.fillRect(sx+24,sy+23,5,5);
 }
 ctx.strokeStyle='#0002';ctx.strokeRect(sx,sy,T,T);
}
function drawPlayer(){
 const sx=p.x-cam,sy=p.y;
 ctx.fillStyle='#0003';ctx.beginPath();ctx.ellipse(sx+16,sy+48,18,5,0,0,Math.PI*2);ctx.fill();
 ctx.fillStyle='#ffd1a0';ctx.fillRect(sx+6,sy+2,20,18);
 ctx.fillStyle='#4a2e1d';ctx.fillRect(sx+6,sy+2,20,6);
 ctx.fillStyle='#111';ctx.fillRect(sx+(p.dir>0?20:10),sy+10,3,3);
 ctx.fillStyle='#e74943';ctx.fillRect(sx+3,sy+20,26,16);
 ctx.fillStyle='#ffd1a0';ctx.fillRect(sx,sy+22,4,11);ctx.fillRect(sx+28,sy+22,4,11);
 ctx.fillStyle='#315aa8';ctx.fillRect(sx+6,sy+36,8,12);ctx.fillRect(sx+18,sy+36,8,12);
}
function draw(){
 ctx.clearRect(0,0,CW,CH);
 const g=ctx.createLinearGradient(0,0,0,CH);
 g.addColorStop(0,'#69c9f3');g.addColorStop(1,'#d8f5ff');
 ctx.fillStyle=g;ctx.fillRect(0,0,CW,CH);

 ctx.fillStyle='#ffffffaa';
 for(let a=-((cam*.12)%280);a<CW+160;a+=280){
   ctx.beginPath();ctx.arc(a+40,75,20,0,7);ctx.arc(a+68,67,27,0,7);ctx.arc(a+98,76,18,0,7);ctx.fill();
 }

 blocks.forEach(b=>{if(b.x-cam>-T&&b.x-cam<CW+T)drawBlock(b)});
 coins.forEach(q=>{if(!q.got){ctx.fillStyle='#ffd83d';ctx.beginPath();ctx.arc(q.x-cam,q.y,10,0,7);ctx.fill();ctx.strokeStyle='#947000';ctx.stroke()}});
 drawPlayer();
}
function loop(){update();draw();requestAnimationFrame(loop)}
function bind(id,key){
 const e=document.getElementById(id);
 e.addEventListener('pointerdown',a=>{a.preventDefault();k[key]=true});
 ['pointerup','pointercancel','pointerleave'].forEach(ev=>e.addEventListener(ev,a=>{a.preventDefault();k[key]=false}));
}
bind('left','l');bind('right','r');bind('jump','j');
function nearest(){
 const tx=p.x+p.w/2+p.dir*T,ty=p.y+p.h/2;let best=null,d=9999;
 for(const b of blocks){const z=Math.hypot(b.x+T/2-tx,b.y+T/2-ty);if(z<d&&z<T*1.8){d=z;best=b}}
 return best;
}
document.getElementById('brk').onclick=()=>{const b=nearest();if(b)blocks.splice(blocks.indexOf(b),1)};
document.getElementById('plant').onclick=()=>{
 if(seeds<=0)return;
 const bx=Math.round((p.x+p.dir*T)/T)*T,by=GROUND-T;
 if(!blocks.some(b=>b.x===bx&&b.y===by)){blocks.push({x:bx,y:by,t:'tree'});seeds--;document.getElementById('seed').textContent=seeds}
};
build();loop();
})();
</script>
</body>
</html>
