<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>MiniWorld Alpha Update 4</title>
<style>
:root{--ui:#17212cf2;--ui2:#0f1720f2;--line:#ffffff2b}
*{box-sizing:border-box;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;touch-action:none}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;font-family:Arial,Helvetica,sans-serif;overscroll-behavior:none}
button,.ctrl,#controls,.controlGroup{-webkit-user-select:none!important;user-select:none!important;-webkit-touch-callout:none!important;-webkit-user-drag:none!important;user-drag:none!important;caret-color:transparent!important;touch-action:none!important;outline:none}
#game{position:fixed;inset:0;width:100vw;height:100vh;display:block;background:#70c9ef}
#hud{position:fixed;left:12px;top:12px;z-index:30;background:var(--ui);color:#fff;padding:8px 12px;border-radius:14px;font-size:14px;box-shadow:0 3px 12px #0004}
#hint{position:fixed;right:12px;top:12px;z-index:30;background:var(--ui);color:#fff;padding:8px 10px;border-radius:14px;font-size:10px;line-height:1.45;text-align:right;box-shadow:0 3px 12px #0004}
#controls{position:fixed;left:14px;right:14px;bottom:14px;z-index:40;display:flex;align-items:flex-end;justify-content:space-between;pointer-events:none}
.controlGroup{display:flex;gap:9px;pointer-events:auto}
.ctrl{position:relative;width:64px;height:64px;border:none;border-radius:18px;color:#fff;background:#192633e8;font-size:26px;font-weight:800;box-shadow:0 4px 12px #0005,inset 0 0 0 2px #ffffff14;appearance:none;-webkit-appearance:none;overflow:hidden}
.ctrl:active{transform:scale(.95);background:#26394c}
.moveArrow::before{content:'';position:absolute;left:50%;top:50%;width:0;height:0;transform:translate(-50%,-50%);border-top:12px solid transparent;border-bottom:12px solid transparent}
.moveArrow.leftArrow::before{border-right:18px solid #fff;margin-left:-2px}
.moveArrow.rightArrow::before{border-left:18px solid #fff;margin-left:2px}

#jump{width:74px;height:74px;border-radius:50%;font-size:30px}
#punchBtn{width:68px;height:68px;border-radius:50%;font-size:28px}
#hotbar{position:fixed;left:50%;transform:translateX(-50%);bottom:12px;z-index:36;display:grid;grid-template-columns:repeat(7,52px);gap:6px;background:var(--ui);padding:8px 10px;border-radius:18px;box-shadow:0 4px 14px #0006}
.slot,.drawerSlot{position:relative;border:2px solid var(--line);background:var(--ui2);color:#fff;border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:25px}
.slot{width:52px;height:52px}
.slot.selected,.drawerSlot.selected{border-color:#fff;box-shadow:0 0 0 2px #ffffff25 inset,0 0 10px #fff3;transform:translateY(-2px)}
.count{position:absolute;right:4px;bottom:3px;font-size:11px;font-weight:800;text-shadow:0 1px 2px #000}
#bpHandle{position:fixed;left:50%;transform:translateX(-50%);bottom:70px;z-index:41;width:118px;height:25px;border-radius:12px 12px 0 0;background:var(--ui);color:#fff;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;box-shadow:0 -2px 8px #0004}
#drawer{position:fixed;left:50%;transform:translateX(-50%);bottom:-48vh;z-index:35;width:min(86vw,600px);height:min(36vh,210px);background:#131d27f7;color:#fff;border-radius:20px 20px 0 0;box-shadow:0 -8px 20px #0008;padding:8px 10px 12px;transition:bottom .22s ease}
#drawer.open{bottom:0}
#drawerTop{text-align:center;font-weight:800;font-size:12px;margin-bottom:4px;touch-action:none;padding:5px 0;cursor:pointer}
#drawerScroll{height:calc(100% - 24px);overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;touch-action:pan-y;padding:3px}
#drawerGrid{display:grid;grid-template-columns:repeat(7,minmax(42px,1fr));gap:6px;touch-action:pan-y}
.drawerSlot{min-height:48px;touch-action:pan-y}
.drawerName{position:absolute;left:4px;top:3px;font-size:7px;opacity:.76}
#zoomControls{position:fixed;left:50%;top:10px;transform:translateX(-50%);z-index:42;display:flex;align-items:center;gap:5px;background:var(--ui);padding:5px 7px;border-radius:14px;box-shadow:0 3px 12px #0004}
.zoomBtn{width:34px;height:30px;border:0;border-radius:9px;background:#263747;color:#fff;font-size:20px;font-weight:800;line-height:1}
#zoomLabel{min-width:42px;color:#fff;text-align:center;font-size:10px;font-weight:800}
#toast{position:fixed;left:50%;top:78px;transform:translateX(-50%);z-index:70;background:#101820e8;color:#fff;padding:8px 12px;border-radius:12px;font-size:12px;opacity:0;pointer-events:none;transition:opacity .15s}
#toast.show{opacity:1}
#rotate{position:fixed;inset:0;z-index:100;background:#111;color:#fff;display:none;align-items:center;justify-content:center;text-align:center;font-size:22px;line-height:1.6}
@media (orientation:portrait){#rotate{display:flex}}
@media (max-width:780px) and (orientation:landscape){#hotbar{grid-template-columns:repeat(7,46px);gap:5px;padding:7px 8px}.slot{width:46px;height:46px;font-size:22px}#bpHandle{bottom:62px}.ctrl{width:58px;height:58px}#jump{width:68px;height:68px}#punchBtn{width:62px;height:62px}}
</style>
</head>
<body>
<canvas id="game" width="1000" height="500"></canvas>
<div id="hud">🪙 <span id="coin">0</span> &nbsp; 🌱 <span id="seedCount">0</span></div>
<div id="hint">HOLD block = BREAK<br>👊 button = BREAK lurus<br>TAP kosong = PLACE<br>Door = RESPAWN<br>Mode: <span id="modeName">PUNCH</span><br><span id="pcHint">PC: A/D • Space • F • B</span></div>
<div id="toast"></div>
<div id="zoomControls"><button class="zoomBtn" id="zoomOut">−</button><span id="zoomLabel">100%</span><button class="zoomBtn" id="zoomIn">＋</button></div>

<div id="controls">
  <div class="controlGroup"><button class="ctrl moveArrow leftArrow" id="left" aria-label="Jalan kiri"></button><button class="ctrl moveArrow rightArrow" id="right" aria-label="Jalan kanan"></button></div>
  <div class="controlGroup"><button class="ctrl" id="punchBtn">👊</button><button class="ctrl" id="jump">▲</button></div>
</div>

<div id="bpHandle">▲ BACKPACK</div>
<div id="hotbar"></div>

<div id="drawer">
  <div id="drawerTop">BACKPACK — swipe turun untuk tutup</div>
  <div id="drawerScroll"><div id="drawerGrid"></div></div>
</div>

<div id="rotate">📱↔️<br>Putar HP ke horizontal</div>

<script>
(()=>{
'use strict';

const canvas=document.getElementById('game'),ctx=canvas.getContext('2d');
const W=1000,H=500,T=40,WORLD_W=100,GROUND_Y=335;
const ui={coin:document.getElementById('coin'),seed:document.getElementById('seedCount'),mode:document.getElementById('modeName'),toast:document.getElementById('toast'),drawer:document.getElementById('drawer'),bpHandle:document.getElementById('bpHandle'),hotbar:document.getElementById('hotbar'),drawerGrid:document.getElementById('drawerGrid'),zoomLabel:document.getElementById('zoomLabel')};

let cameraX=0,cameraY=0,cameraTarget=0,zoom=1,coinsCollected=0,selectedType='tool',selectedItem='punch';
const inventory={grass:6,dirt:6,stone:2,wood:3,leaf:3,grassSeed:0,dirtSeed:0,stoneSeed:0,woodSeed:0,leafSeed:0};
const seedForBlock={grass:'grassSeed',dirt:'dirtSeed',stone:'stoneSeed',wood:'woodSeed',leaf:'leafSeed'};
const itemIcon={grass:'🟩',dirt:'🟫',stone:'🪨',wood:'🪵',leaf:'🌿',grassSeed:'🌱',dirtSeed:'🌾',stoneSeed:'🫘',woodSeed:'🌰',leafSeed:'🍀'};
const itemName={grass:'GRASS',dirt:'DIRT',stone:'STONE',wood:'WOOD',leaf:'LEAF',grassSeed:'GRASS SEED',dirtSeed:'DIRT SEED',stoneSeed:'STONE SEED',woodSeed:'TREE SEED',leafSeed:'LEAF SEED'};
const blockItems=['grass','dirt','stone','wood','leaf'];
const seedItems=['grassSeed','dirtSeed','stoneSeed','woodSeed','leafSeed'];
const dropRate={grass:{block:.42,seed:.30},dirt:{block:.38,seed:.20},stone:{block:.32,seed:.08},wood:{block:.45,seed:.24},leaf:{block:.24,seed:.42}};
const debrisColor={grass:'#52bd58',dirt:'#9b6034',stone:'#888f94',wood:'#9a612d',leaf:'#3aaa50'};

const player={x:120,y:GROUND_Y-50,w:30,h:50,vx:0,vy:0,onGround:false,facing:1,spawnX:120,spawnY:GROUND_Y-50,punchAnim:0,walkTime:0};
const input={left:false,right:false,jump:false};
let blocks=[],drops=[],particles=[],coins=[],door=null;
let breakState=null;
let touchBreakActive=false,touchStartX=0,touchStartY=0;
let punchHeld=false;

function toast(msg){ui.toast.textContent=msg;ui.toast.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>ui.toast.classList.remove('show'),850)}
function addBlock(tx,ty,type){if(tx<0||ty<0||blockAt(tx,ty))return;blocks.push({x:tx*T,y:ty*T,t:type})}
function blockAt(tx,ty){return blocks.find(b=>Math.floor(b.x/T)===tx&&Math.floor(b.y/T)===ty)}
function isSolidBlock(b){return b.t!=='wood'&&b.t!=='leaf'}

function buildWorld(){
  blocks=[];drops=[];particles=[];coins=[];
  for(let x=0;x<WORLD_W;x++){
    addBlock(x,Math.floor(GROUND_Y/T),'grass');
    addBlock(x,Math.floor(GROUND_Y/T)+1,'dirt');
    addBlock(x,Math.floor(GROUND_Y/T)+2,'dirt');
    addBlock(x,Math.floor(GROUND_Y/T)+3,'dirt');
    addBlock(x,Math.floor(GROUND_Y/T)+4,'dirt');
  }
  for(let x=8;x<=12;x++)addBlock(x,Math.floor(GROUND_Y/T)-1,'grass');
  for(let x=20;x<=24;x++)addBlock(x,Math.floor(GROUND_Y/T)-2,'grass');
  for(let x=31;x<=34;x++)addBlock(x,Math.floor(GROUND_Y/T)-1,'grass');
  addBlock(39,Math.floor(GROUND_Y/T)-1,'stone');
  addBlock(40,Math.floor(GROUND_Y/T)-1,'stone');

  const treeX=47,gy=Math.floor(GROUND_Y/T);
  addBlock(treeX,gy-1,'wood');addBlock(treeX,gy-2,'wood');
  addBlock(treeX-1,gy-3,'leaf');addBlock(treeX,gy-3,'leaf');addBlock(treeX+1,gy-3,'leaf');
  addBlock(treeX-1,gy-4,'leaf');addBlock(treeX,gy-4,'leaf');addBlock(treeX+1,gy-4,'leaf');

  // World Start Door diacak sekali setiap world/session dimulai.
  // Selama sesi berjalan posisinya tetap; reload halaman akan mengacak lagi.
  const safeDoorTiles=[];
  for(let x=5;x<WORLD_W-6;x++){
    const blocked=(x>=7&&x<=13)||(x>=19&&x<=25)||(x>=30&&x<=35)||(x>=38&&x<=41)||(x>=44&&x<=50);
    if(!blocked)safeDoorTiles.push(x);
  }
  const doorTile=safeDoorTiles[Math.floor(Math.random()*safeDoorTiles.length)];
  door={x:doorTile*T,y:GROUND_Y-72,w:44,h:72};
  player.spawnX=door.x+7;
  player.spawnY=GROUND_Y-player.h;
  player.x=player.spawnX;
  player.y=player.spawnY;
  const viewWidth=W/zoom;
  cameraX=Math.max(0,Math.min(WORLD_W*T-viewWidth,player.x-viewWidth*.30));
  cameraTarget=cameraX;
  cameraY=GROUND_Y-GROUND_Y/zoom;

  coins=[{x:11*T,y:GROUND_Y-75,got:false},{x:22*T,y:GROUND_Y-120,got:false},{x:33*T,y:GROUND_Y-75,got:false}];
}

function rectHit(ax,ay,aw,ah,bx,by,bw,bh){return ax<bx+bw&&ax+aw>bx&&ay<by+bh&&ay+ah>by}
function playerHitsBlock(b){return rectHit(player.x,player.y,player.w,player.h,b.x,b.y,T,T)}
function respawn(){player.x=player.spawnX;player.y=player.spawnY;player.vx=0;player.vy=0;const viewWidth=W/zoom;cameraTarget=Math.max(0,Math.min(WORLD_W*T-viewWidth,player.x-viewWidth*.30));toast('Respawn di World Start Door')}

function updatePlayer(){
  const accel=.62,maxSpeed=4.5,friction=.80;
  if(input.left)player.vx-=accel;
  if(input.right)player.vx+=accel;
  if(!input.left&&!input.right)player.vx*=friction;
  player.vx=Math.max(-maxSpeed,Math.min(maxSpeed,player.vx));
  if(Math.abs(player.vx)<.05)player.vx=0;
  if(player.vx!==0){player.facing=player.vx<0?-1:1;player.walkTime+=Math.abs(player.vx)*.035}
  if(input.jump&&player.onGround){player.vy=-10.8;player.onGround=false;input.jump=false}
  player.vy+=.52;player.vy=Math.min(player.vy,13);

  player.x+=player.vx;
  for(const b of blocks){
    if(!isSolidBlock(b))continue; // wood & leaf bisa ditembus
    if(playerHitsBlock(b)){
      if(player.vx>0)player.x=b.x-player.w;
      else if(player.vx<0)player.x=b.x+T;
      player.vx=0;
    }
  }

  player.y+=player.vy;player.onGround=false;
  for(const b of blocks){
    if(!isSolidBlock(b))continue; // wood & leaf tidak menahan player
    if(playerHitsBlock(b)){
      if(player.vy>0){player.y=b.y-player.h;player.vy=0;player.onGround=true}
      else if(player.vy<0){player.y=b.y+T;player.vy=0}
    }
  }

  if(player.y>H+180)respawn();
  player.x=Math.max(0,Math.min(WORLD_W*T-player.w,player.x));
  const viewWidth=W/zoom;
  cameraTarget=Math.max(0,Math.min(WORLD_W*T-viewWidth,player.x-viewWidth*.30));
  cameraX+=(cameraTarget-cameraX)*.085;
  cameraY=GROUND_Y-GROUND_Y/zoom;
  if(player.punchAnim>0)player.punchAnim-=.11;
}

function updateDrops(){
  for(const d of drops){
    d.vy+=.35;d.y+=d.vy;d.x+=d.vx;d.vx*=.96;
    const tx=Math.floor(d.x/T),ty=Math.floor((d.y+16)/T),below=blockAt(tx,ty);
    if(below&&isSolidBlock(below)&&d.y+16>below.y){d.y=below.y-16;d.vy=0;d.vx*=.9}
    if(rectHit(player.x,player.y,player.w,player.h,d.x-10,d.y-10,20,20)){
      d.pick=true;inventory[d.item]=(inventory[d.item]||0)+1;updateInventory();
    }
  }
  drops=drops.filter(d=>!d.pick);
}

function updateParticles(){
  for(const p of particles){p.vy+=.22;p.x+=p.vx;p.y+=p.vy;p.vx*=.97;p.life-=.035}
  particles=particles.filter(p=>p.life>0);
}

function updateCoins(){for(const c of coins)if(!c.got&&Math.hypot((player.x+player.w/2)-c.x,(player.y+player.h/2)-c.y)<32){c.got=true;coinsCollected++;ui.coin.textContent=coinsCollected}}

function updateBreak(){
  if(!breakState)return;
  if(!blocks.includes(breakState.block)){breakState=null;return}
  const elapsed=performance.now()-breakState.start;
  breakState.progress=Math.min(1,elapsed/breakState.duration);
  if(breakState.progress>=1){
    const b=breakState.block;
    breakState=null;
    breakBlock(b);
    player.punchAnim=1;
  }
}

function update(){
  updatePlayer();
  updateDrops();
  updateParticles();
  updateCoins();
  updateBreak();

  // Kalau tombol punch masih ditahan, lanjut pukul block berikutnya.
  if(punchHeld && !breakState)tryPunchButton();
}

function drawSky(){
  const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#69c9f2');g.addColorStop(1,'#d8f6ff');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  ctx.fillStyle='#ffffffbb';
  for(let a=-((cameraX*.12)%300)-100;a<W+160;a+=300){ctx.beginPath();ctx.arc(a+50,76,18,0,Math.PI*2);ctx.arc(a+78,67,28,0,Math.PI*2);ctx.arc(a+108,77,20,0,Math.PI*2);ctx.fill()}
}

function drawBlock(b){
  const x=b.x,y=b.y;
  if(b.t==='grass'){
    ctx.fillStyle='#8b5a2d';ctx.fillRect(x,y,T,T);ctx.fillStyle='#43b84e';ctx.fillRect(x,y,T,10);ctx.fillStyle='#65d36d';ctx.fillRect(x+4,y+2,6,5);ctx.fillRect(x+24,y+4,8,4);
  }else if(b.t==='dirt'){
    ctx.fillStyle='#8b5a2d';ctx.fillRect(x,y,T,T);ctx.fillStyle='#b97942';ctx.fillRect(x+6,y+7,6,4);ctx.fillRect(x+25,y+22,5,5);ctx.fillRect(x+14,y+31,4,3);
  }else if(b.t==='stone'){
    ctx.fillStyle='#6f767b';ctx.fillRect(x,y,T,T);ctx.fillStyle='#969da1';ctx.fillRect(x+6,y+7,8,6);ctx.fillRect(x+24,y+23,7,6);
  }else if(b.t==='wood'){
    ctx.fillStyle='#875326';ctx.fillRect(x,y,T,T);ctx.fillStyle='#b77837';ctx.fillRect(x+6,y+3,T-12,T-6);ctx.fillStyle='#8f5727';ctx.fillRect(x+18,y+3,4,T-6);
  }else if(b.t==='leaf'){
    ctx.fillStyle='#2f9b49';ctx.fillRect(x,y,T,T);ctx.fillStyle='#57c969';ctx.fillRect(x+5,y+6,9,8);ctx.fillRect(x+23,y+20,8,7);
  }
  ctx.strokeStyle='#0002';ctx.strokeRect(x+.5,y+.5,T-1,T-1);
}

function drawDoor(){
  const x=door.x,y=door.y;
  ctx.fillStyle='#68401f';ctx.fillRect(x,y,door.w,door.h);
  ctx.fillStyle='#9c6130';ctx.fillRect(x+6,y+6,door.w-12,door.h-6);
  ctx.fillStyle='#392616';ctx.fillRect(x+11,y+14,door.w-22,door.h-20);
  ctx.fillStyle='#e7bf4f';ctx.fillRect(x+31,y+39,5,5);
  ctx.fillStyle='#ffffffdd';ctx.font='bold 10px Arial';ctx.fillText('WORLD START',x-11,y-7);
}

function drawPlayer(){
  const x=player.x,y=player.y,bob=player.onGround&&Math.abs(player.vx)>.15?Math.sin(player.walkTime*5)*1.5:0;
  ctx.fillStyle='#0003';ctx.beginPath();ctx.ellipse(x+15,y+player.h+3,18,5,0,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#f5c690';ctx.fillRect(x+4,y+5+bob,22,20);
  ctx.fillStyle='#55341f';ctx.fillRect(x+4,y+2+bob,22,7);ctx.fillRect(x+3,y+7+bob,5,8);
  ctx.fillStyle='#fff';ctx.fillRect(x+(player.facing>0?16:8),y+11+bob,7,7);
  ctx.fillStyle='#202020';ctx.fillRect(x+(player.facing>0?20:9),y+13+bob,3,4);
  ctx.fillStyle='#e64b45';ctx.fillRect(x+2,y+25+bob,26,15);
  const armPunch=player.punchAnim>0?Math.sin((1-player.punchAnim)*Math.PI)*14:0;
  ctx.fillStyle='#f5c690';
  if(player.facing>0){ctx.fillRect(x+27,y+27+bob,5+armPunch,7);ctx.fillRect(x-2,y+27+bob,5,12)}
  else{ctx.fillRect(x-2-armPunch,y+27+bob,5+armPunch,7);ctx.fillRect(x+27,y+27+bob,5,12)}
  ctx.fillStyle='#315ba8';ctx.fillRect(x+5,y+40+bob,8,10);ctx.fillRect(x+17,y+40+bob,8,10);
}

function drawDrops(){
  ctx.font='18px Arial';
  for(const d of drops){const x=d.x,y=d.y;ctx.fillText(itemIcon[d.item]||'📦',x-9,y+6)}
}

function drawParticles(){
  for(const p of particles){
    ctx.globalAlpha=Math.max(0,p.life);
    ctx.fillStyle=p.color;
    ctx.fillRect(p.x,p.y,p.size,p.size);
  }
  ctx.globalAlpha=1;
}

function drawCoins(){for(const q of coins){if(q.got)continue;const x=q.x;ctx.fillStyle='#ffd83d';ctx.beginPath();ctx.arc(x,q.y,10,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#967000';ctx.stroke()}}

function drawBreakCracks(){
  if(!breakState||!blocks.includes(breakState.block))return;
  const b=breakState.block,p=breakState.progress||0;
  const x=b.x,y=b.y,cx=x+T/2,cy=y+T/2;
  ctx.save();
  ctx.strokeStyle='rgba(25,25,25,'+(0.45+0.5*p)+')';
  ctx.lineWidth=2;
  const rays=[[-15,-14],[-4,-19],[11,-16],[17,-4],[15,12],[3,18],[-12,16],[-18,4]];
  const visible=Math.max(1,Math.ceil(p*rays.length));
  for(let i=0;i<visible;i++){
    const [rx,ry]=rays[i];
    const ex=cx+rx*p,ey=cy+ry*p;
    ctx.beginPath();ctx.moveTo(cx,cy);ctx.lineTo(ex,ey);ctx.stroke();
    if(p>.45){ctx.beginPath();ctx.moveTo(ex,ey);ctx.lineTo(ex+ry*.22,ey-rx*.18);ctx.stroke()}
  }
  if(p>.75){ctx.strokeStyle='rgba(255,255,255,.22)';ctx.strokeRect(x+2,y+2,T-4,T-4)}
  ctx.restore();
}

function draw(){
  // Sky/UI tetap screen-space; world di-render dengan zoom camera.
  ctx.setTransform(1,0,0,1,0,0);
  drawSky();

  ctx.save();
  ctx.setTransform(zoom,0,0,zoom,-cameraX*zoom,-cameraY*zoom);
  const viewWidth=W/zoom;
  for(const b of blocks){if(b.x>cameraX-T&&b.x<cameraX+viewWidth+T)drawBlock(b)}
  drawDoor();drawCoins();drawDrops();drawParticles();drawPlayer();drawBreakCracks();
  ctx.restore();
  ctx.setTransform(1,0,0,1,0,0);
}

function loop(){update();draw();requestAnimationFrame(loop)}

function totalSeeds(){return seedItems.reduce((sum,n)=>sum+(inventory[n]||0),0)}

function slotHTML(type,item,drawer=false){
  const icon=type==='tool'?(item==='punch'?'👊':'🔧'):(itemIcon[item]||'📦');
  const name=type==='tool'?(item==='punch'?'PUNCH':'WRENCH'):(itemName[item]||item.toUpperCase());
  const count=type==='tool'?'':`<span class="count">${inventory[item]||0}</span>`;
  const label=drawer?`<span class="drawerName">${name}</span>`:'';
  const klass=drawer?'drawerSlot':'slot';
  return `<div class="${klass}" data-type="${type}" data-item="${item}">${label}${icon}${count}</div>`;
}

function renderInventory(){
  // Punch & Wrench selalu tersedia. Item dengan jumlah 0 tidak ditampilkan.
  const owned=[...blockItems,...seedItems].filter(n=>(inventory[n]||0)>0);
  const entries=[{type:'tool',item:'punch'},{type:'tool',item:'wrench'},...owned.map(item=>({type:seedItems.includes(item)?'seed':'block',item}))];

  ui.hotbar.innerHTML=entries.slice(0,7).map(e=>slotHTML(e.type,e.item,false)).join('');
  ui.drawerGrid.innerHTML=entries.map(e=>slotHTML(e.type,e.item,true)).join('');

  // Backpack minimal 7 posisi visual, tapi item 0 tidak punya slot item.
  const missing=Math.max(0,7-entries.length);
  for(let i=0;i<missing;i++)ui.drawerGrid.insertAdjacentHTML('beforeend','<div class="drawerSlot"><span class="drawerName">EMPTY</span>＋</div>');

  // Jika item yang sedang dipilih habis, kembali ke Punch.
  if(selectedType!=='tool'&&(inventory[selectedItem]||0)<=0){selectedType='tool';selectedItem='punch'}
  applySelectionHighlight();
  ui.seed.textContent=totalSeeds();
}

function updateInventory(){renderInventory()}

function applySelectionHighlight(){
  document.querySelectorAll('.slot,.drawerSlot').forEach(el=>el.classList.toggle('selected',el.dataset.type===selectedType&&el.dataset.item===selectedItem));
}

function setSelected(type,item){
  selectedType=type;selectedItem=item;
  applySelectionHighlight();
  ui.mode.textContent=item==='punch'?'PUNCH':item==='wrench'?'WRENCH':(itemName[item]||item.replace('Seed',' SEED').toUpperCase());
}

function chooseInventoryItem(el){
  if(!el||!el.dataset.item)return;
  setSelected(el.dataset.type,el.dataset.item);
  if(el.dataset.type==='seed')toast('Seed planting nanti kita upgrade');
}

ui.hotbar.addEventListener('pointerdown',e=>{
  const el=e.target.closest('[data-item]');
  if(!el)return;e.preventDefault();e.stopPropagation();chooseInventoryItem(el);
},{passive:false});
ui.drawerGrid.addEventListener('click',e=>{
  const el=e.target.closest('[data-item]');
  if(!el)return;e.preventDefault();e.stopPropagation();chooseInventoryItem(el);
});

function bindHold(id,key){
  const el=document.getElementById(id);
  const down=e=>{e.preventDefault();e.stopPropagation();input[key]=true;try{el.setPointerCapture(e.pointerId)}catch(_){}};
  const up=e=>{e.preventDefault();e.stopPropagation();input[key]=false};
  el.addEventListener('pointerdown',down,{passive:false});
  el.addEventListener('pointerup',up,{passive:false});
  el.addEventListener('pointercancel',up,{passive:false});
  el.addEventListener('contextmenu',e=>e.preventDefault(),{passive:false});
  el.addEventListener('dragstart',e=>e.preventDefault(),{passive:false});
  el.addEventListener('selectstart',e=>e.preventDefault(),{passive:false});
  // Android/iOS: cegah gesture long-press browser sebelum dianggap selection/copy.
  el.addEventListener('touchstart',e=>e.preventDefault(),{passive:false});
  el.addEventListener('touchmove',e=>e.preventDefault(),{passive:false});
}
bindHold('left','left');bindHold('right','right');

const jump=document.getElementById('jump');
jump.addEventListener('pointerdown',e=>{e.preventDefault();input.jump=true},{passive:false});
jump.addEventListener('pointerup',e=>{e.preventDefault();input.jump=false},{passive:false});
jump.addEventListener('contextmenu',e=>e.preventDefault());

function nearestPunchBlock(){
  // Tombol Punch hanya lurus/horizontal sesuai arah hadap.
  // Tidak otomatis memilih block di atas ataupun block tanah di bawah.
  const frontX=player.facing>0?player.x+player.w:player.x;
  const centerY=player.y+player.h*.52;
  let best=null,bestForward=Infinity;

  for(const b of blocks){
    const bx=b.x+T/2,by=b.y+T/2;
    const forward=(bx-frontX)*player.facing;
    const vertical=Math.abs(by-centerY);
    if(forward<-T*.20||forward>T*2.05)continue;
    if(vertical>T*.48)continue;
    if(forward<bestForward){best=b;bestForward=forward}
  }
  return best;
}

function startBreak(b,duration=480,source='touch'){
  if(!b)return;
  breakState={block:b,start:performance.now(),duration,progress:0,source};
}
function cancelBreak(source){
  if(!breakState)return;
  if(!source||breakState.source===source)breakState=null;
}

const punchBtn=document.getElementById('punchBtn');

function tryPunchButton(){
  setSelected('tool','punch');
  player.punchAnim=1;

  // Jangan menimpa proses break yang sedang berjalan.
  if(breakState)return;

  const target=nearestPunchBlock();
  if(target){
    startBreak(target,320,'button');
  }
}

punchBtn.addEventListener('pointerdown',e=>{
  e.preventDefault();
  punchHeld=true;
  try{punchBtn.setPointerCapture(e.pointerId)}catch(_){}
  tryPunchButton();
},{passive:false});

punchBtn.addEventListener('pointerup',e=>{
  e.preventDefault();
  punchHeld=false;
},{passive:false});

punchBtn.addEventListener('pointercancel',e=>{
  e.preventDefault();
  punchHeld=false;
},{passive:false});

punchBtn.addEventListener('contextmenu',e=>e.preventDefault());

function inRange(tx,ty){const cx=tx*T+T/2,cy=ty*T+T/2;return Math.hypot((player.x+player.w/2)-cx,(player.y+player.h/2)-cy)<=T*3.15}
function overlapsPlayer(tx,ty){return rectHit(player.x,player.y,player.w,player.h,tx*T,ty*T,T,T)}
function canvasPoint(e){const r=canvas.getBoundingClientRect(),sx=(e.clientX-r.left)/r.width*W,sy=(e.clientY-r.top)/r.height*H;const wx=cameraX+sx/zoom,wy=cameraY+sy/zoom;return{sx,sy,wx,wy,tx:Math.floor(wx/T),ty:Math.floor(wy/T)}}

function spawnDrop(x,y,item){drops.push({x,y,item,vx:(Math.random()-.5)*2.4,vy:-3.5-Math.random()*1.6})}
function spawnDebris(b){
  const color=debrisColor[b.t]||'#999';
  for(let i=0;i<11;i++)particles.push({x:b.x+T/2+(Math.random()-.5)*18,y:b.y+T/2+(Math.random()-.5)*18,vx:(Math.random()-.5)*5,vy:-2.5-Math.random()*3,size:3+Math.random()*5,life:.75+Math.random()*.25,color});
}
function breakBlock(b){
  const idx=blocks.indexOf(b);if(idx<0)return;
  blocks.splice(idx,1);spawnDebris(b);
  // Semua block memakai rate yang sama, termasuk block yang dipasang player.
  // Jadi hasil break bisa block, seed, atau tidak ada drop sama sekali.
  const rate=dropRate[b.t]||{block:.25,seed:.1},r=Math.random();
  if(r<rate.block)spawnDrop(b.x+T/2,b.y+T/2,b.t);
  else if(r<rate.block+rate.seed)spawnDrop(b.x+T/2,b.y+T/2,seedForBlock[b.t]||'grassSeed');
}

canvas.addEventListener('pointerdown',e=>{
  e.preventDefault();
  const pt=canvasPoint(e);if(!inRange(pt.tx,pt.ty))return;
  const b=blockAt(pt.tx,pt.ty);
  if(selectedItem==='wrench'){if(b)toast('Wrench: nanti untuk edit object');return}
  if(b&&selectedItem==='punch'){
    touchBreakActive=true;touchStartX=e.clientX;touchStartY=e.clientY;player.punchAnim=1;startBreak(b,480,'touch');return;
  }
  if(!b&&selectedType==='block'){
    if((inventory[selectedItem]||0)<=0||overlapsPlayer(pt.tx,pt.ty))return;
    const neighbors=[blockAt(pt.tx+1,pt.ty),blockAt(pt.tx-1,pt.ty),blockAt(pt.tx,pt.ty+1),blockAt(pt.tx,pt.ty-1)].filter(Boolean);
    if(neighbors.length){addBlock(pt.tx,pt.ty,selectedItem);inventory[selectedItem]--;updateInventory()}
  }
},{passive:false});
canvas.addEventListener('pointermove',e=>{if(!touchBreakActive)return;if(Math.hypot(e.clientX-touchStartX,e.clientY-touchStartY)>22){touchBreakActive=false;cancelBreak('touch')}},{passive:false});
canvas.addEventListener('pointerup',()=>{touchBreakActive=false;cancelBreak('touch')},{passive:false});
canvas.addEventListener('pointercancel',()=>{touchBreakActive=false;cancelBreak('touch')},{passive:false});
canvas.addEventListener('contextmenu',e=>e.preventDefault());

function setZoom(next){
  zoom=Math.max(.70,Math.min(1.35,Math.round(next*100)/100));
  ui.zoomLabel.textContent=Math.round(zoom*100)+'%';
  const viewWidth=W/zoom;
  cameraTarget=Math.max(0,Math.min(WORLD_W*T-viewWidth,player.x-viewWidth*.30));
  cameraX=Math.max(0,Math.min(WORLD_W*T-viewWidth,cameraX));
  cameraY=GROUND_Y-GROUND_Y/zoom;
}

document.getElementById('zoomOut').addEventListener('pointerdown',e=>{e.preventDefault();setZoom(zoom-.15)},{passive:false});
document.getElementById('zoomIn').addEventListener('pointerdown',e=>{e.preventDefault();setZoom(zoom+.15)},{passive:false});

let swipeStart=null;
function setDrawer(open){ui.drawer.classList.toggle('open',open);ui.bpHandle.textContent=open?'▼ TUTUP':'▲ BACKPACK'}
ui.bpHandle.addEventListener('pointerdown',e=>{e.preventDefault();swipeStart=e.clientY;try{ui.bpHandle.setPointerCapture(e.pointerId)}catch(_){}},{passive:false});
ui.bpHandle.addEventListener('pointerup',e=>{e.preventDefault();if(swipeStart===null)return;const dy=e.clientY-swipeStart;if(ui.drawer.classList.contains('open')){if(dy>14||Math.abs(dy)<10)setDrawer(false)}else{if(dy<-14||Math.abs(dy)<10)setDrawer(true)}swipeStart=null},{passive:false});

const drawerTop=document.getElementById('drawerTop');let drawerSwipeY=null;
drawerTop.addEventListener('pointerdown',e=>{e.preventDefault();drawerSwipeY=e.clientY;try{drawerTop.setPointerCapture(e.pointerId)}catch(_){}},{passive:false});
drawerTop.addEventListener('pointerup',e=>{e.preventDefault();if(drawerSwipeY!==null&&e.clientY-drawerSwipeY>22)setDrawer(false);drawerSwipeY=null},{passive:false});
drawerTop.addEventListener('pointercancel',()=>{drawerSwipeY=null});

const drawerScroll=document.getElementById('drawerScroll');let scrollSwipeY=null;
drawerScroll.addEventListener('pointerdown',e=>{if(e.target.closest('.drawerSlot'))return;scrollSwipeY=e.clientY},{passive:true});
drawerScroll.addEventListener('pointerup',e=>{if(scrollSwipeY!==null&&drawerScroll.scrollTop<=4&&e.clientY-scrollSwipeY>35)setDrawer(false);scrollSwipeY=null},{passive:true});

// ===== Keyboard controls untuk PC/laptop =====
const heldKeys=new Set();
function isTypingTarget(el){return !!el && (el.tagName==='INPUT'||el.tagName==='TEXTAREA'||el.isContentEditable)}

window.addEventListener('keydown',e=>{
  if(isTypingTarget(e.target))return;
  const key=e.key.toLowerCase();
  const code=e.code;

  if(key==='a'||e.key==='ArrowLeft'){
    e.preventDefault();input.left=true;heldKeys.add('left');
  }
  if(key==='d'||e.key==='ArrowRight'){
    e.preventDefault();input.right=true;heldKeys.add('right');
  }
  if(key==='w'||e.key==='ArrowUp'||code==='Space'){
    e.preventDefault();
    if(!e.repeat)input.jump=true;
  }
  if(key==='f'){
    e.preventDefault();
    punchHeld=true;
    if(!e.repeat)tryPunchButton();
  }
  if(key==='b'&&!e.repeat){
    e.preventDefault();setDrawer(!ui.drawer.classList.contains('open'));
  }
  if(e.key==='Escape'&&!e.repeat){
    if(ui.drawer.classList.contains('open')){e.preventDefault();setDrawer(false)}
  }
},{passive:false});

window.addEventListener('keyup',e=>{
  const key=e.key.toLowerCase();
  if(key==='a'||e.key==='ArrowLeft'){e.preventDefault();input.left=false;heldKeys.delete('left')}
  if(key==='d'||e.key==='ArrowRight'){e.preventDefault();input.right=false;heldKeys.delete('right')}
  if(key==='w'||e.key==='ArrowUp'||e.code==='Space'){e.preventDefault();input.jump=false}
  if(key==='f'){e.preventDefault();punchHeld=false}
},{passive:false});

window.addEventListener('blur',()=>{
  input.left=false;input.right=false;input.jump=false;punchHeld=false;heldKeys.clear();
});

// Cegah selection/drag/callout di seluruh kontrol game.
const protectedControls=document.getElementById('controls');
['contextmenu','selectstart','dragstart'].forEach(type=>protectedControls.addEventListener(type,e=>e.preventDefault(),{passive:false}));

document.addEventListener('contextmenu',e=>e.preventDefault(),{passive:false});
document.addEventListener('selectstart',e=>e.preventDefault(),{passive:false});
document.addEventListener('dragstart',e=>{if(e.target.closest&&e.target.closest('#controls'))e.preventDefault()},{passive:false});

buildWorld();setZoom(1);updateInventory();setSelected('tool','punch');loop();
})();
</script>
